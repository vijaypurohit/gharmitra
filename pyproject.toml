[project]
name = "gharmitra"
version = "0.1.0"
description = "A chat agent that books, reschedules and cancels home-service errands safely."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
gharmitra = "gharmitra.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gharmitra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
